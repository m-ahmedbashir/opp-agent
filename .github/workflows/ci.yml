name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # prisma generate (runs via postinstall) needs a syntactically valid
          # DATABASE_URL but never connects to it — no real database needed for CI.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
        env:
          GROQ_API_KEY: test-key-not-used-tests-mock-the-sdk
